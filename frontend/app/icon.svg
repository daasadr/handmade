<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Handmade.net">
  <defs>
    <linearGradient id="hmSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00CED1"/>
      <stop offset="1" stop-color="#00A86B"/>
    </linearGradient>
  </defs>
  <!-- Teplá hnědá dlaždice (foreground z palety) — gradientová jiskra na ní vynikne i při 16 px. -->
